# FabricManager has an internal GFM timeout of 30s, within which if NVLINK is not
# established it will fail. In some cases, we've seen the service hanging and timing out.
# In such cases, a restart of the service fixes it.
[Unit]
StartLimitIntervalSec=infinity
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=5
