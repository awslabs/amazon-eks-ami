# Installed to /etc/systemd/system/kubelet.service.d/restart-with-cri-proxy.conf
#
# kubelet holds a persistent gRPC connection to the CRI socket. When cri-proxy
# restarts, the old socket is replaced and kubelet's connection goes dead
# without automatic reconnection. PartOf= makes systemd propagate a cri-proxy
# restart or stop to kubelet so it re-dials the new socket. Start order comes
# from Before=kubelet.service in cri-proxy.service.
[Unit]
PartOf=cri-proxy.service
