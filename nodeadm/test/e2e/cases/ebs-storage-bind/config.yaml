---
apiVersion: node.eks.aws/v1alpha1
kind: NodeConfig
spec:
  cluster:
    name: my-cluster
    apiServerEndpoint: https://example.com
    certificateAuthority: Y2VydGlmaWNhdGVBdXRob3JpdHk=
    cidr: 10.100.0.0/16
  instance:
    storage:
      volumes:
        - device: "/dev/loop0"
          mountTarget: /mnt/k8s-disks/ebs0
          bindTargets:
            - /var/lib/containerd
            - /var/lib/kubelet
            - /var/log/pods
          fsType: ext4
